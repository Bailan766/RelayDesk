name: Windows build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - name: Download and verify sing-box
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'sing-box.zip'
          Invoke-WebRequest 'https://github.com/SagerNet/sing-box/releases/download/v1.15.0-alpha.14/sing-box-1.15.0-alpha.14-windows-amd64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'AF88C8BC8CC7AD66EF276B029FC9AB4B3246CE011A5FFB030E9DB2E2D1087176') { throw 'sing-box checksum mismatch' }
          Expand-Archive $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'sing-box')
          "SING_BOX=$(Join-Path $env:RUNNER_TEMP 'sing-box/sing-box-1.15.0-alpha.14-windows-amd64/sing-box.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download and verify Mihomo
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mihomo.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'mihomo'
          Invoke-WebRequest 'https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-windows-amd64-v1-v1.19.34.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '703e325bfeee582f874b06d054eaae55ab7c194645d1835411685aafa85da5ea') { throw 'Mihomo checksum mismatch' }
          Expand-Archive $archive -DestinationPath $directory
          "MIHOMO=$(Join-Path $directory 'mihomo-windows-amd64-v1.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $license = Join-Path $directory 'LICENSE'
          Invoke-WebRequest 'https://raw.githubusercontent.com/MetaCubeX/mihomo/v1.19.34/LICENSE' -OutFile $license
          if ((Get-FileHash $license -Algorithm SHA256).Hash -ne '3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986') { throw 'Mihomo license checksum mismatch' }
      - name: Download and verify GeoData
        shell: pwsh
        run: |
          $geoDir = Join-Path $env:RUNNER_TEMP 'geodata'
          New-Item -ItemType Directory -Path $geoDir | Out-Null
          Invoke-WebRequest 'https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb' -OutFile (Join-Path $geoDir 'Country.mmdb')
          Invoke-WebRequest 'https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb.sha256sum' -OutFile (Join-Path $geoDir 'Country.mmdb.sha256sum')
          $expectedMmdb = ((Get-Content (Join-Path $geoDir 'Country.mmdb.sha256sum') -Raw).Trim() -split '\s+')[0].ToUpperInvariant()
          if ((Get-FileHash (Join-Path $geoDir 'Country.mmdb') -Algorithm SHA256).Hash -ne $expectedMmdb) { throw 'Country.mmdb checksum mismatch' }
          Invoke-WebRequest 'https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb' -OutFile (Join-Path $geoDir 'geoip.metadb')
          Invoke-WebRequest 'https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb.sha256sum' -OutFile (Join-Path $geoDir 'geoip.metadb.sha256sum')
          $expectedMeta = ((Get-Content (Join-Path $geoDir 'geoip.metadb.sha256sum') -Raw).Trim() -split '\s+')[0].ToUpperInvariant()
          if ((Get-FileHash (Join-Path $geoDir 'geoip.metadb') -Algorithm SHA256).Hash -ne $expectedMeta) { throw 'geoip.metadb checksum mismatch' }
      - name: Download and verify Wintun
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wintun'
          Invoke-WebRequest 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') { throw 'Wintun checksum mismatch' }
          Expand-Archive $archive -DestinationPath $dir
      - run: npm test
      - run: npm run build
      - name: Prepare installer resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build-resources | Out-Null
          Copy-Item $env:SING_BOX build-resources/sing-box.exe
          Copy-Item (Join-Path $env:RUNNER_TEMP 'sing-box/sing-box-1.15.0-alpha.14-windows-amd64/libcronet.dll') build-resources/libcronet.dll
          Copy-Item (Join-Path $env:RUNNER_TEMP 'sing-box/sing-box-1.15.0-alpha.14-windows-amd64/LICENSE') build-resources/THIRD-PARTY-SING-BOX-LICENSE.txt
          Copy-Item (Join-Path $env:RUNNER_TEMP 'mihomo/mihomo-windows-amd64-v1.exe') build-resources/mihomo.exe
          Copy-Item (Join-Path $env:RUNNER_TEMP 'mihomo/LICENSE') build-resources/THIRD-PARTY-MIHOMO-LICENSE.txt
          Copy-Item (Join-Path $env:RUNNER_TEMP 'wintun/wintun/bin/amd64/wintun.dll') build-resources/wintun.dll
          Copy-Item (Join-Path $env:RUNNER_TEMP 'wintun/wintun/LICENSE.txt') build-resources/THIRD-PARTY-WINTUN-LICENSE.txt
          Copy-Item (Join-Path $env:RUNNER_TEMP 'geodata/Country.mmdb') build-resources/Country.mmdb
          Copy-Item (Join-Path $env:RUNNER_TEMP 'geodata/geoip.metadb') build-resources/geoip.metadb
      - name: Test Windows data protection
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --bundles nsis
      - name: Package proxy cores
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item src-tauri/target/release/relaydesk.exe release/
          Copy-Item build-resources/sing-box.exe, build-resources/libcronet.dll, build-resources/mihomo.exe, build-resources/wintun.dll, build-resources/Country.mmdb, build-resources/geoip.metadb, build-resources/THIRD-PARTY-SING-BOX-LICENSE.txt, build-resources/THIRD-PARTY-MIHOMO-LICENSE.txt, build-resources/THIRD-PARTY-WINTUN-LICENSE.txt -Destination release/
          Copy-Item LICENSE release/RELAYDESK-LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md release/
          Compress-Archive -Path release/* -DestinationPath relaydesk-windows-x64-portable.zip
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe relaydesk-windows-x64-setup.exe
      - name: Smoke test installer
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'RelayDeskSmoke'
          $setup = Start-Process -FilePath (Resolve-Path relaydesk-windows-x64-setup.exe) -ArgumentList '/S', "/D=$install" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          foreach ($name in @('relaydesk.exe', 'sing-box.exe', 'libcronet.dll', 'mihomo.exe', 'wintun.dll', 'Country.mmdb', 'geoip.metadb', 'THIRD-PARTY-SING-BOX-LICENSE.txt', 'THIRD-PARTY-MIHOMO-LICENSE.txt', 'THIRD-PARTY-WINTUN-LICENSE.txt')) {
            if (-not (Test-Path (Join-Path $install $name))) { throw "Missing installed file: $name" }
          }
          & .github/scripts/test-windows-network.ps1 -App (Join-Path $install 'relaydesk.exe')
          $env:RELAYDESK_INSTALLED_SMOKE_APP = Join-Path $install 'relaydesk.exe'
          npm test -- src/mihomo-integration.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Installed Mihomo profile test failed' }
          cargo test --manifest-path src-tauri/Cargo.toml network::mihomo_tun_test::installed_mihomo_profile_captures_tcp_udp_and_dns_then_releases_the_tun -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Installed Mihomo TUN bridge test failed' }
          cargo test --manifest-path src-tauri/Cargo.toml network::mihomo_tun_test::installed_node_tun_keeps_the_selected_node_and_mode_and_can_cancel_recovery -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Installed TUN recovery test failed' }
          npm test -- src/wireguard-integration.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Installed WireGuard TUN test failed' }
          cargo test --manifest-path src-tauri/Cargo.toml supervisor::tests::installed_worker_recovers_and_explicit_stop_cancels_it -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Installed worker recovery test failed' }
          cargo test --manifest-path src-tauri/Cargo.toml supervisor::tests::installed_worker_switches_failed_node_and_keeps_the_same_session -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Installed worker node failover test failed' }
          $env:RELAYDESK_WINDOWS_PROXY_SMOKE = '1'
          cargo test --manifest-path src-tauri/Cargo.toml system_proxy::tests::windows_restores_pac_and_keeps_user_changes_to_auto_detection -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Windows system proxy preservation test failed' }
          $upgrade = Start-Process -FilePath (Resolve-Path relaydesk-windows-x64-setup.exe) -ArgumentList '/S', "/D=$install" -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "In-place reinstall failed: $($upgrade.ExitCode)" }
          $uninstaller = Get-ChildItem -LiteralPath $install -Filter 'uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw "Missing uninstaller" }
          $remove = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstall failed: $($remove.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: relaydesk-windows-x64
          path: |
            relaydesk-windows-x64-portable.zip
            relaydesk-windows-x64-setup.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $args = @('release', 'create', $env:GITHUB_REF_NAME, 'relaydesk-windows-x64-setup.exe', 'relaydesk-windows-x64-portable.zip', '--title', "RelayDesk $env:GITHUB_REF_NAME", '--notes-file', 'RELEASE_NOTES.md')
          if ($env:GITHUB_REF_NAME -match '-') { $args += '--prerelease' }
          & gh @args

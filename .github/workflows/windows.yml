name: Windows build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - name: Download and verify sing-box
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'sing-box.zip'
          Invoke-WebRequest 'https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df') { throw 'sing-box checksum mismatch' }
          Expand-Archive $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'sing-box')
          "SING_BOX=$(Join-Path $env:RUNNER_TEMP 'sing-box/sing-box-1.14.4-windows-amd64/sing-box.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm test
      - run: npm run build
      - name: Prepare installer resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build-resources | Out-Null
          Copy-Item $env:SING_BOX build-resources/sing-box.exe
          Copy-Item (Join-Path $env:RUNNER_TEMP 'sing-box/sing-box-1.14.4-windows-amd64/LICENSE') build-resources/THIRD-PARTY-SING-BOX-LICENSE.txt
      - name: Test Windows data protection
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --bundles nsis
      - name: Package pinned sing-box
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item src-tauri/target/release/relaydesk.exe release/
          Copy-Item (Join-Path $env:RUNNER_TEMP 'sing-box/sing-box-1.14.4-windows-amd64/sing-box.exe') release/
          Copy-Item (Join-Path $env:RUNNER_TEMP 'sing-box/sing-box-1.14.4-windows-amd64/LICENSE') release/THIRD-PARTY-SING-BOX-LICENSE.txt
          Copy-Item LICENSE release/RELAYDESK-LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md release/
          Compress-Archive -Path release/* -DestinationPath relaydesk-windows-x64-portable.zip
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe relaydesk-windows-x64-setup.exe
      - name: Smoke test installer
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'RelayDeskSmoke'
          $setup = Start-Process -FilePath (Resolve-Path relaydesk-windows-x64-setup.exe) -ArgumentList '/S', "/D=$install" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          foreach ($name in @('relaydesk.exe', 'sing-box.exe', 'THIRD-PARTY-SING-BOX-LICENSE.txt')) {
            if (-not (Test-Path (Join-Path $install $name))) { throw "Missing installed file: $name" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: relaydesk-windows-x64
          path: |
            relaydesk-windows-x64-portable.zip
            relaydesk-windows-x64-setup.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME relaydesk-windows-x64-setup.exe relaydesk-windows-x64-portable.zip --title "RelayDesk $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --prerelease
